
name: CI/CD — Innovatech Chile
 
# Trigger: solo al hacer push sobre la rama deploy
on:
  push:
    branches:
      - deploy
  workflow_dispatch:
 
env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: innovatech-eks-cluster
 
jobs:
  deploy:
    name: Build → Push ECR → Deploy EKS
    runs-on: ubuntu-latest
 
    steps:
 
      # ── 1. Checkout ───────────────────────────
      - name: Checkout del código
        uses: actions/checkout@v4
 
      # ── 2. Credenciales AWS ───────────────────
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}
 
      # ── 3. Login en ECR ───────────────────────
      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
 
      # ── 4. Build y Push — ms-ventas ──────────
      - name: Build y Push ms-ventas
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.ECR_REGISTRY }}/innovatech-ms-ventas:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/innovatech-ms-ventas:latest \
            ./back-Ventas_SpringBoot/
          docker push ${{ env.ECR_REGISTRY }}/innovatech-ms-ventas:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/innovatech-ms-ventas:latest
 
      # ── 5. Build y Push — ms-despachos ───────
      - name: Build y Push ms-despachos
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.ECR_REGISTRY }}/innovatech-ms-despachos:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/innovatech-ms-despachos:latest \
            ./back-Despachos_SpringBoot/
          docker push ${{ env.ECR_REGISTRY }}/innovatech-ms-despachos:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/innovatech-ms-despachos:latest
 
      # ── 6. Build y Push — frontend ────────────
      - name: Build y Push frontend
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_API_VENTAS_URL="${{ secrets.VITE_API_VENTAS_URL }}" \
            --build-arg VITE_API_DESPACHOS_URL="${{ secrets.VITE_API_DESPACHOS_URL }}" \
            -t ${{ env.ECR_REGISTRY }}/innovatech-frontend:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/innovatech-frontend:latest \
            ./front_despacho
          docker push ${{ env.ECR_REGISTRY }}/innovatech-frontend:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/innovatech-frontend:latest
 
      # ── 7. Configurar kubectl para EKS ────────
      - name: Configurar kubeconfig para EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}
 
      # ── 8. Actualizar imágenes en el clúster ──
      - name: Actualizar imágenes en EKS
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ env.ECR_REGISTRY }}/innovatech-frontend:${{ github.sha }}
 
          kubectl set image deployment/backend-ventas \
            backend-ventas=${{ env.ECR_REGISTRY }}/innovatech-ms-ventas:${{ github.sha }}
 
          kubectl set image deployment/backend-despachos \
            backend-despachos=${{ env.ECR_REGISTRY }}/innovatech-ms-despachos:${{ github.sha }}
 
      # ── 9. Verificar despliegue ───────────────
      - name: Verificar rollout de deployments
        run: |
          kubectl rollout status deployment/frontend --timeout=120s
          kubectl rollout status deployment/backend-ventas --timeout=120s
          kubectl rollout status deployment/backend-despachos --timeout=120s


          # ── 10. Mostrar URL pública del ALB ──────
      - name: URL de la aplicación
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region us-east-1 \
            --query 'LoadBalancers[*].DNSName' \
            --output text)
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DESPLIEGUE EXITOSO — Innovatech Chile"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🌐 Frontend:    http://$ALB_DNS"
          echo "📦 ms-ventas:   http://$ALB_DNS/api/ventas/"
          echo "🚚 ms-despachos: http://$ALB_DNS/api/despachos/"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
 